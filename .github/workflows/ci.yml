name: Radiopharmaceutical USP 825 - Tests and Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[test]'

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Audit-chain smoke test
      env:
        AUDIT_SECRET_KEY: ci-only-audit-secret-key-not-for-production
      run: |
        python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
    - name: Compile Python
      run: python -m compileall -q agents usp_825_nuclear cli.py simulator.py enrichment.py
    - name: Check browser JavaScript syntax
      run: node --check web/app.js && node --check web/demo-engine.js && node --test web/demo-engine.test.js
