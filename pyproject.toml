[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radiopharmaceutical-usp-825-engine"
version = "2.0.0"
description = "USP-825 Sentinel: Nuclear Medicine Radiopharmaceutical Quality Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
radiopharmaceutical-usp-825-engine = "usp_825_nuclear.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/radiopharmaceutical-usp-825-engine"
Repository = "https://github.com/abusuraihsakhri/radiopharmaceutical-usp-825-engine.git"
